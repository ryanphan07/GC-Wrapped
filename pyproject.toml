[project]
name = "gcwrapped"
version = "0.1.0"
description = "Group chat analytics platform: chat exports to Postgres warehouse to Wrapped profiles."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings",
    "psycopg[binary]",
]

[project.scripts]
gcw = "gcwrapped.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "hypothesis==6.170.15",
    # Presidio, spaCy and the model: dev-group only, so the Airflow image (--no-dev) never gets them.
    {include-group = "redaction"},
]
dbt = [
    "dbt-postgres>=1.10",
]
dashboard = [
    "streamlit",
    "pandas",
]
redaction = [
    "presidio-analyzer==2.2.366",
    "spacy==3.8.18",
    "en-core-web-lg",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

# pandas ships no type information; streamlit is only installed with the dashboard group.
[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "streamlit", "streamlit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a running Postgres (writes only to gcw_test); run with `make test-integration`",
    "warehouse: needs gcw_dev after migrate, ingest and dbt build, plus the gcw_reader role; run with `make test-warehouse`",
]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
