# Default project name. COMPOSE_PROJECT_NAME from the --env-file overrides it (verified), which is how
# a real-data run gets its own containers and volumes. Every make target passes --env-file.
name: gc-wrapped

services:
  db:
    image: pgvector/pgvector:pg17
    # terse: server log errors omit DETAIL/STATEMENT-style context that can quote row values.
    command: ["postgres", "-c", "log_error_verbosity=terse"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GCW_READER_PASSWORD: ${GCW_READER_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-${POSTGRES_PORT:-5432}}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local dev only: `airflow standalone` runs the API server, scheduler and DAG processor in one
  # container with a SQLite metadata DB. Open http://localhost:8080 (all users are admin).
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
      target: runtime
    image: gcw-airflow:runtime
    command: ["standalone"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      GCW_LANDING_DIR: /opt/gcw-landing
      # dbt's gcw_timezone var reads this; the default keeps an env file without it working.
      CHAT_TIMEZONE: ${CHAT_TIMEZONE:-America/Los_Angeles}
      # Consent allowlist: gcw ingest and check-landing read it. Empty by default, which makes
      # ingest fail (deny by default); the env file must list the thread IDs. No bypass exists.
      GCW_THREAD_ALLOWLIST: ${GCW_THREAD_ALLOWLIST:-}
      # GCW_DB_NAME is the one setting that picks the target database for gcw and dbt (no default:
      # it comes from the env file, so a real run is a deliberate choice).
      GCW_DB_NAME: ${GCW_DB_NAME:?set GCW_DB_NAME in the env file}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Optional tag task (D89): the compose-network URL of the llm service, e.g. http://llm:8080.
      # Empty (the default) skips the task. The client refuses any other host.
      GCW_LLM_URL: ${GCW_AIRFLOW_LLM_URL:-}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${GCW_LANDING_HOST_DIR:-./data/landing}:/opt/gcw-landing:ro

  # Streamlit dashboard on http://localhost:8501. Connects as gcw_reader: marts only, no message text.
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: gcw-dashboard
    depends_on:
      db:
        condition: service_healthy
    environment:
      GCW_DB_NAME: ${GCW_DB_NAME:?set GCW_DB_NAME in the env file}
      GCW_READER_PASSWORD: ${GCW_READER_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    healthcheck:
      # The slim image has no curl; Streamlit answers 200 on this path without touching the DB.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://localhost:8501/_stcore/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Local llama.cpp server for tagging (D89, D90). CPU image pinned by digest. Behind the `llm`
  # profile, so `make up`, `make e2e` and CI never start it; `make tag` names it explicitly. The
  # model file is mounted read-only from GCW_MODEL_DIR (`make llm-model` puts it there) and the port is
  # published on 127.0.0.1 only. A real-data stack sets its own GCW_LLM_PORT so two stacks can coexist.
  # No text leaves through this server: --no-slots removes the endpoint that shows in-flight
  # prompts, --no-webui removes the chat UI, and --props and --metrics stay off (their default).
  # Logging stays at the default level, which does not print prompts (a local test checks the logs).
  llm:
    profiles: ["llm"]
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:c7d58273d753d33a352e5c41ab300c5ae040a16fa4b202231bb606478065c124
    command:
      - --model
      - /models/${GCW_LLM_MODEL_FILE:-Qwen3-4B-Instruct-2507-Q4_K_M.gguf}
      - --alias
      - qwen3-4b-instruct-2507-q4_k_m
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "2048"
      - --parallel
      - "1"
      - --threads
      - "8"
      - --no-slots
      - --no-webui
    ports:
      - "127.0.0.1:${GCW_LLM_PORT:-8081}:8080"
    volumes:
      - ${GCW_MODEL_DIR:-${HOME}/.cache/gcw/models}:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

volumes:
  pgdata:
