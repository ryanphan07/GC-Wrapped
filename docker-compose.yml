# Default project name. COMPOSE_PROJECT_NAME from the --env-file overrides it (verified), which is how
# a real-data run gets its own containers and volumes. Every make target passes --env-file.
name: gc-wrapped

services:
  db:
    image: pgvector/pgvector:pg17
    # terse: server log errors omit DETAIL/STATEMENT-style context that can quote row values.
    command: ["postgres", "-c", "log_error_verbosity=terse"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GCW_READER_PASSWORD: ${GCW_READER_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-${POSTGRES_PORT:-5432}}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local dev only: `airflow standalone` runs the API server, scheduler and DAG processor in one
  # container with a SQLite metadata DB. Open http://localhost:8080 (all users are admin).
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
      target: runtime
    image: gcw-airflow:runtime
    command: ["standalone"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      GCW_LANDING_DIR: /opt/gcw-landing
      # dbt's gcw_timezone var reads this; the default keeps an env file without it working.
      CHAT_TIMEZONE: ${CHAT_TIMEZONE:-America/Los_Angeles}
      # GCW_DB_NAME is the one setting that picks the target database for gcw and dbt (no default:
      # it comes from the env file, so a real run is a deliberate choice).
      GCW_DB_NAME: ${GCW_DB_NAME:?set GCW_DB_NAME in the env file}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${GCW_LANDING_HOST_DIR:-./data/landing}:/opt/gcw-landing:ro

  # Streamlit dashboard on http://localhost:8501. Connects as gcw_reader: marts only, no message text.
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: gcw-dashboard
    depends_on:
      db:
        condition: service_healthy
    environment:
      GCW_DB_NAME: ${GCW_DB_NAME:?set GCW_DB_NAME in the env file}
      GCW_READER_PASSWORD: ${GCW_READER_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    healthcheck:
      # The slim image has no curl; Streamlit answers 200 on this path without touching the DB.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://localhost:8501/_stcore/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
