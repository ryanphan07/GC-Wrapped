gcwrapped:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT') | as_number }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      # No default on purpose: the same GCW_DB_NAME that gcw uses, or dbt refuses to run.
      dbname: "{{ env_var('GCW_DB_NAME') }}"
      schema: analytics
      threads: 4
