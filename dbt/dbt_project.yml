name: gcwrapped
version: "0.1.0"
config-version: 2

profile: gcwrapped

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages"]

vars:
  # Raw timestamps stay UTC; staging derives local time in this zone.
  gcw_timezone: America/Los_Angeles

# staging = views (cast, rename, light derivations). Marts will be tables; no incremental models.
models:
  gcwrapped:
    staging:
      +materialized: view
