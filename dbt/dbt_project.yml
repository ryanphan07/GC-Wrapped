name: gcwrapped
version: "0.1.0"
config-version: 2

profile: gcwrapped

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages"]

vars:
  # Raw timestamps stay UTC; staging derives local time in this zone.
  gcw_timezone: "{{ env_var('CHAT_TIMEZONE', 'America/Los_Angeles') }}"
  # A gap longer than this between consecutive messages in a thread starts a new session.
  session_gap_minutes: 60
  # The D98 default model: fct_message_tags falls back to it while enrich.tag_default is empty (D92). A
  # test keeps it equal to gcwrapped.tagging.model.MODEL_ID.
  gcw_default_tag_model: qwen3.5-4b-q4_k_m

# The placeholder patterns (D95) are data, not text: the seed lives in analytics with no reader grant.
seeds:
  gcwrapped:
    +schema: analytics
    instagram_placeholder_patterns:
      +column_types:
        pattern_id: text
        pattern: text
        description: text

# staging and intermediate = views; marts = tables, except fct_message_eligibility (a view, D75)
# and mart_member_wrapped (a view, D124). No incremental models.
models:
  gcwrapped:
    # Staging and intermediate carry message text, so they live in their own schema that the
    # reader role gets no USAGE on. Schema names are exact (see macros/generate_schema_name.sql).
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: analytics
      # The dashboard's read-only role sees marts only (no message text). Staging and
      # intermediate get no grants. The roles are created outside dbt (gcw_reader: docker init /
      # CI setup; gcw_ask: migration 009). Grants are listed per model, not for the whole folder,
      # because dbt merges a model-level grants config into the folder's instead of replacing it,
      # so a model could not opt out. A new mart gets no grant until it is added here (fails
      # closed).
      #
      # gcw_reader (D128): a relation listed here counts and names only local_ok senders. Add one
      # only together with its check in tests/reader_relations_are_consented.sql.
      agg_activity_daily: &reader_grant
        +grants:
          select: ['gcw_reader']
      agg_member_activity: *reader_grant
      agg_tags_by_sender: *reader_grant
      agg_tags_by_thread: *reader_grant
      fct_consented_messages: *reader_grant
      fct_sessions: *reader_grant
      # mart_member_wrapped: one aggregate profile per consented member (D123), no message text.
      mart_member_wrapped: *reader_grant
      # gcw_ask (D127): the dbt relations answering reads (gcwrapped.dashboard.ask_role), granted
      # here too so that a rebuild keeps them. They hold every message, so no reader grant (D128).
      fct_messages: &ask_grant
        +grants:
          select: ['gcw_ask']
      fct_message_eligibility: *ask_grant
      fct_message_text: *ask_grant
      # No grant at all: dim_members and fct_reactions (every sender, D128) and fct_message_tags
      # (per-message labels; the aggregates above are what the dashboard reads).

# Table grants alone are not enough: the role also needs USAGE on the schema to see the tables.
# analytics only; neither role is ever granted anything on staging. Idempotent, safe every build.
on-run-end:
  - "grant usage on schema analytics to gcw_reader, gcw_ask"
