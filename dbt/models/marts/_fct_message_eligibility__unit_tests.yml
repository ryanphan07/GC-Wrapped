version: 2

unit_tests:
  - name: eligibility_levels_by_consent
    description: >
      D88. "yes" gives local_ok and external_ok; "local" gives local_ok only; "no", blank, a sender
      missing from the ledger, and the same name in another thread's ledger row give neither.
    model: fct_message_eligibility
    given:
      - input: ref('stg_instagram__messages')
        rows:
          - {message_key: m1, thread_id: t1, sender_name: A}
          - {message_key: m2, thread_id: t1, sender_name: B}
          - {message_key: m3, thread_id: t1, sender_name: C}
          - {message_key: m4, thread_id: t1, sender_name: D}
          - {message_key: m5, thread_id: t2, sender_name: A}
          - {message_key: m6, thread_id: t1, sender_name: E}
      - input: ref('stg_consent__sender_consent')
        rows:
          - {thread_id: t1, sender_name: A, consent: "yes"}
          - {thread_id: t1, sender_name: B, consent: "no"}
          - {thread_id: t1, sender_name: C, consent: ""}
          - {thread_id: t2, sender_name: Z, consent: "yes"}
          - {thread_id: t1, sender_name: E, consent: "local"}
    expect:
      rows:
        - {message_key: m1, local_ok: true, external_ok: true}
        - {message_key: m2, local_ok: false, external_ok: false}
        - {message_key: m3, local_ok: false, external_ok: false}
        - {message_key: m4, local_ok: false, external_ok: false}
        - {message_key: m5, local_ok: false, external_ok: false}
        - {message_key: m6, local_ok: true, external_ok: false}

  - name: eligibility_false_with_no_ledger
    description: With no ledger loaded, every message is local_ok = false and external_ok = false.
    model: fct_message_eligibility
    given:
      - input: ref('stg_instagram__messages')
        rows:
          - {message_key: m1, thread_id: t1, sender_name: A}
          - {message_key: m2, thread_id: t2, sender_name: B}
      - input: ref('stg_consent__sender_consent')
        format: sql
        rows: select null::text as thread_id, null::text as sender_name, null::text as consent where false
    expect:
      rows:
        - {message_key: m1, local_ok: false, external_ok: false}
        - {message_key: m2, local_ok: false, external_ok: false}
