name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # The spaCy model wheel is several hundred MB: cache it with the rest of the uv cache.
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync
      - run: make lint
      - run: make test

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: gcw
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gcw -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: gcw
      POSTGRES_PASSWORD: ci-password
      POSTGRES_PORT: 5432
      GCW_DB_NAME: gcw_dev
      GCW_THREAD_ALLOWLIST: 1784563920183746,293847561029384,48271936502817364
      DATABASE_URL: postgresql://gcw:ci-password@localhost:5432/gcw_dev
      GCW_READER_PASSWORD: ci-reader-password
      DASHBOARD_DATABASE_URL: postgresql://gcw_reader:ci-reader-password@localhost:5432/gcw_dev
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # The spaCy model wheel is several hundred MB: cache it with the rest of the uv cache.
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --group dbt --group dashboard
      - name: Run init SQL (creates gcw_dev, gcw_real, vector extension)
        run: psql "postgresql://gcw:ci-password@localhost:5432/postgres" -v ON_ERROR_STOP=1 -f docker/postgres/init/01-create-databases.sql
      # Same script docker-compose runs on first start. dbt grants rely on the role existing.
      - name: Create the read-only dashboard role
        run: bash docker/postgres/init/02-reader-role.sh
        env:
          PGHOST: localhost
          PGUSER: gcw
          PGPASSWORD: ci-password
      - run: make test-integration
      - run: make dbt-debug
      # End to end on synthetic data (integration tests write only to gcw_test; the reset keeps this step
      # independent of earlier state), then migrate -> ingest -> dbt build (models + tests).
      - name: Reset gcw_dev
        run: >
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          -c "DROP SCHEMA IF EXISTS raw CASCADE"
          -c "DROP SCHEMA IF EXISTS analytics CASCADE"
          -c "DROP SCHEMA IF EXISTS staging CASCADE"
          -c "DROP TABLE IF EXISTS schema_migrations"
      - run: uv run gcw migrate
      - run: make synth
      - run: uv run gcw ingest tests/fixtures/synthetic/export_a
      - run: make dbt-deps
      - run: make dbt-build
      # Dashboard queries, permission-denied checks for gcw_reader, and the Streamlit AppTest.
      - run: make test-warehouse

  airflow:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: gcw
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gcw -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GCW_DB_NAME: gcw_dev
      GCW_THREAD_ALLOWLIST: 1784563920183746,293847561029384,48271936502817364
      DATABASE_URL: postgresql://gcw:ci-password@localhost:5432/gcw_dev
      LANDING: ${{ github.workspace }}/ci-landing
      GCW_READER_PASSWORD: ci-reader-password
      PGHOST: localhost
      PGUSER: gcw
      PGPASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # The spaCy model wheel is several hundred MB: cache it with the rest of the uv cache.
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync
      - name: Build images (runtime, and runtime + pytest)
        run: |
          docker build -f airflow/Dockerfile --target runtime -t gcw-airflow:runtime .
          docker build -f airflow/Dockerfile --target test -t gcw-airflow:test .
      - name: DAG tests (inside the image)
        run: docker run --rm gcw-airflow:test
      - name: Create gcw_dev and generate a synthetic landing dir
        run: |
          psql "postgresql://gcw:ci-password@localhost:5432/postgres" -v ON_ERROR_STOP=1 -f docker/postgres/init/01-create-databases.sql
          uv run python tests/synthetic/instagram.py --out "$LANDING"
          # dbt's grants and on-run-end hook name gcw_reader, so the role must exist.
          bash docker/postgres/init/02-reader-role.sh
      - name: Run the DAG end to end (airflow dags test)
        run: |
          docker run --rm --network host             -e GCW_DB_NAME -e GCW_THREAD_ALLOWLIST -e GCW_LANDING_DIR=/landing             -e POSTGRES_HOST=localhost -e POSTGRES_PORT=5432             -e POSTGRES_USER=gcw -e POSTGRES_PASSWORD=ci-password             -v "$LANDING:/landing:ro"             gcw-airflow:runtime             bash -c "airflow db migrate && airflow dags test gcw_pipeline" 2>&1 | tee dags-test.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Assert the pipeline produced data and dbt passed
        run: |
          grep -E "PASS=[0-9]+ WARN=[0-9]+ ERROR=0 " dags-test.log
          test "$(psql "$DATABASE_URL" -tA -c 'SELECT count(*) FROM raw.messages')" -gt 0
          test "$(psql "$DATABASE_URL" -tA -c 'SELECT count(*) FROM analytics.fct_messages')" -gt 0
          test "$(psql "$DATABASE_URL" -tA -c 'SELECT count(*) FROM staging.stg_instagram__messages')" -gt 0
          psql "$DATABASE_URL" -tA -c "SELECT status FROM raw.load_runs ORDER BY load_id DESC LIMIT 1" | grep -qx succeeded

  # The exact command used on real data, on synthetic data: compose builds and starts the db and
  # dashboard, the Airflow DAG runs once, and a second run must insert nothing.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # The spaCy model wheel is several hundred MB: cache it with the rest of the uv cache.
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync
      - name: Write the CI env file and a synthetic landing dir
        run: |
          # The runner context is not available in job-level env, so export the paths from here.
          echo "ENV_FILE=$RUNNER_TEMP/ci.env" >> "$GITHUB_ENV"
          echo "LANDING=$RUNNER_TEMP/ci-landing" >> "$GITHUB_ENV"
          ENV_FILE="$RUNNER_TEMP/ci.env"
          LANDING="$RUNNER_TEMP/ci-landing"
          CONSENT="$RUNNER_TEMP/ci-consent/senders.csv"
          cat > "$ENV_FILE" <<EOF
          COMPOSE_PROJECT_NAME=gc-wrapped-ci
          GCW_DB_NAME=gcw_dev
          GCW_THREAD_ALLOWLIST=1784563920183746,293847561029384,48271936502817364
          POSTGRES_USER=gcw
          POSTGRES_PASSWORD=ci-password
          POSTGRES_PORT=5432
          GCW_READER_PASSWORD=ci-reader-password
          GCW_LANDING_HOST_DIR=$LANDING
          GCW_CONSENT_LEDGER=$CONSENT
          EOF
          # Also writes the synthetic consent ledger (a mix of yes, no and blank) to $CONSENT.
          uv run python tests/synthetic/instagram.py --out "$LANDING" --ledger "$CONSENT"
      - name: make e2e (first run)
        run: make e2e ENV_FILE="$ENV_FILE" 2>&1 | tee e2e-1.log; test "${PIPESTATUS[0]}" -eq 0
      - name: Compose project comes from the env file, not the pinned default
        run: |
          docker volume ls --format '{{.Name}}'
          docker volume ls --format '{{.Name}}' | grep -qx 'gc-wrapped-ci_pgdata'
          # No volume under the pinned default project name may exist.
          if docker volume ls --format '{{.Name}}' | grep -q '^gc-wrapped_'; then echo "volume under the pinned default project name exists"; exit 1; fi
      - name: Dashboard is healthy and the marts are populated
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8501/_stcore/health)" = 200
          psql() { docker compose --env-file "$ENV_FILE" exec -T db psql -U gcw -d gcw_dev -tA -c "$1"; }
          test "$(psql 'SELECT count(*) FROM raw.messages')" -gt 0
          test "$(psql 'SELECT count(*) FROM analytics.fct_messages')" -gt 0
          test "$(psql 'SELECT count(*) FROM staging.stg_instagram__messages')" -gt 0
          # No staging or intermediate relation may live in analytics.
          test "$(psql "SELECT count(*) FROM pg_tables WHERE schemaname = 'analytics' AND tablename ~ '^(stg|int)_'")" -eq 0
          # The only view in analytics is fct_message_eligibility (D75); every other mart is a table.
          test "$(psql "SELECT string_agg(viewname, ',') FROM pg_views WHERE schemaname = 'analytics'")" = "fct_message_eligibility"
          # The reader role: marts yes, the staging schema itself no, the eligibility view no.
          reader() { docker compose --env-file "$ENV_FILE" exec -T -e PGPASSWORD=ci-reader-password db psql -U gcw_reader -d gcw_dev -tA -c "$1" 2>&1; }
          test "$(reader 'SELECT count(*) FROM analytics.fct_messages')" -gt 0
          reader 'SELECT 1 FROM staging.stg_instagram__messages LIMIT 1' | grep -q "permission denied for schema staging"
          reader 'SELECT 1 FROM analytics.fct_message_eligibility LIMIT 1' | grep -q "permission denied for view fct_message_eligibility"
          test "$(psql 'SELECT rows_inserted FROM raw.load_runs ORDER BY load_id DESC LIMIT 1')" -gt 0
          grep -qx "target database: gcw_dev" e2e-1.log
      - name: make e2e (second run inserts nothing)
        run: make e2e ENV_FILE="$ENV_FILE" 2>&1 | tee e2e-2.log; test "${PIPESTATUS[0]}" -eq 0
      - name: Second run was idempotent
        run: |
          psql() { docker compose --env-file "$ENV_FILE" exec -T db psql -U gcw -d gcw_dev -tA -c "$1"; }
          test "$(psql 'SELECT count(*) FROM raw.load_runs')" -ge 2
          test "$(psql 'SELECT rows_inserted FROM raw.load_runs ORDER BY load_id DESC LIMIT 1')" -eq 0
          test "$(psql 'SELECT count(*) FROM raw.messages')" -gt 0
          grep "rows inserted:" e2e-2.log | tail -n 1 | grep -qx "rows inserted: 0"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8501/_stcore/health)" = 200
      # The second gate (D69). The template adds nothing the synthetic ledger lacks, the load is
      # idempotent, and after one more e2e run exactly the "yes" senders' messages are external_ok.
      - name: Consent ledger (template, load, eligibility)
        run: |
          make consent-template ENV_FILE="$ENV_FILE" 2>&1 | tee consent-t1.log; test "${PIPESTATUS[0]}" -eq 0
          grep -qx "consent-template: ok" consent-t1.log
          grep -qx "new rows added: 0" consent-t1.log
          make consent-load ENV_FILE="$ENV_FILE" 2>&1 | tee consent-l1.log; test "${PIPESTATUS[0]}" -eq 0
          make consent-load ENV_FILE="$ENV_FILE" 2>&1 | tee consent-l2.log; test "${PIPESTATUS[0]}" -eq 0
          grep -qx "consent-load: ok" consent-l1.log
          cmp consent-l1.log consent-l2.log
          make e2e ENV_FILE="$ENV_FILE" 2>&1 | tee e2e-3.log; test "${PIPESTATUS[0]}" -eq 0
          psql() { docker compose --env-file "$ENV_FILE" exec -T db psql -U gcw -d gcw_dev -tA -c "$1"; }
          yes_messages="$(psql "SELECT count(*) FROM raw.messages m JOIN raw.sender_consent c ON c.thread_id = m.thread_id AND c.sender_name = m.sender_name WHERE c.consent = 'yes'")"
          test "$yes_messages" -gt 0
          test "$(psql 'SELECT count(*) FROM analytics.fct_message_eligibility WHERE external_ok')" -eq "$yes_messages"
          test "$(psql 'SELECT count(*) FROM analytics.fct_message_eligibility WHERE NOT external_ok')" -gt 0
          make metrics ENV_FILE="$ENV_FILE" 2>&1 | tee consent-metrics.log; test "${PIPESTATUS[0]}" -eq 0
          grep -qx "external-eligible messages: $yes_messages" consent-metrics.log
      # D75: the eligibility mart is a view, so a consent change shows up the moment consent-load
      # commits. Flip one "yes" sender to "no" in a copy of the synthetic ledger, load the copy, and
      # query with no e2e or dbt build in between.
      - name: Consent change shows up without a dbt build
        run: |
          psql() { docker compose --env-file "$ENV_FILE" exec -T db psql -U gcw -d gcw_dev -tA -c "$1"; }
          before="$(psql 'SELECT count(*) FROM analytics.fct_message_eligibility WHERE external_ok')"
          FLIPPED="$RUNNER_TEMP/ci-consent/flipped.csv"
          # Synthetic data only: copy the ledger, flip its first "yes" row to "no", print that row.
          IFS=$'\t' read -r thread sender < <(uv run python - "$RUNNER_TEMP/ci-consent/senders.csv" "$FLIPPED" <<'PY'
          import csv, sys
          src, dst = sys.argv[1:3]
          with open(src, newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          row = next(r for r in rows if r["consent"] == "yes")
          row["consent"] = "no"
          with open(dst, "w", newline="", encoding="utf-8") as f:
              w = csv.DictWriter(f, fieldnames=["consent", "thread_id", "sender_name", "messages"])
              w.writeheader()
              w.writerows(rows)
          print(row["thread_id"], row["sender_name"], sep="\t")
          PY
          )
          flipped_messages="$(psql "SELECT count(*) FROM raw.messages WHERE thread_id = '$thread' AND sender_name = '$sender'")"
          test "$flipped_messages" -gt 0
          sed "s|^GCW_CONSENT_LEDGER=.*|GCW_CONSENT_LEDGER=$FLIPPED|" "$ENV_FILE" > "$RUNNER_TEMP/ci-flipped.env"
          make consent-load ENV_FILE="$RUNNER_TEMP/ci-flipped.env" 2>&1 | tee consent-l3.log; test "${PIPESTATUS[0]}" -eq 0
          expected=$((before - flipped_messages))
          test "$(psql 'SELECT count(*) FROM analytics.fct_message_eligibility WHERE external_ok')" -eq "$expected"
          make metrics ENV_FILE="$RUNNER_TEMP/ci-flipped.env" 2>&1 | tee consent-metrics2.log; test "${PIPESTATUS[0]}" -eq 0
          grep -qx "external-eligible messages: $expected" consent-metrics2.log
      # D70: every ingested message goes through the redaction module in memory; no member-name
      # token may survive, and every raw message is scanned.
      - name: Redaction audit
        run: |
          psql() { docker compose --env-file "$ENV_FILE" exec -T db psql -U gcw -d gcw_dev -tA -c "$1"; }
          make redaction-audit ENV_FILE="$ENV_FILE" 2>&1 | tee redaction-audit.log; test "${PIPESTATUS[0]}" -eq 0
          grep -qx "redaction-audit: ok" redaction-audit.log
          grep -qx "member-name tokens remaining: 0" redaction-audit.log
          grep -qx "backstop replacements: 0" redaction-audit.log
          grep -qx "target database: gcw_dev" redaction-audit.log
          raw="$(psql 'SELECT count(*) FROM raw.messages')"
          test "$raw" -gt 0
          grep -qx "messages scanned: $raw" redaction-audit.log
          if grep -qi sentinel redaction-audit.log; then echo "sentinel string in audit output"; exit 1; fi
      - name: Compose logs on failure
        if: failure()
        run: docker compose --env-file "$ENV_FILE" logs --no-color --tail=80 db dashboard

  # `make real-ingest` is never run locally by the coding assistant (decisions.md, 2026-11-05), so
  # this job is its end-to-end test. Same command as a real run, on the synthetic sentinel landing:
  # its own compose project, ports and database (gcw_ci), and a log dir outside the workspace.
  # Any SENTINEL string on the terminal output (case-insensitive) fails the job.
  real-ingest-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # The spaCy model wheel is several hundred MB: cache it with the rest of the uv cache.
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync
      - name: Write the env file and generate the sentinel landing dir
        run: |
          LANDING="$RUNNER_TEMP/sentinel-landing"
          LOGS="$RUNNER_TEMP/real-ingest-logs"
          mkdir -p "$LOGS"
          echo "ENV_FILE=$RUNNER_TEMP/real-ingest.env" >> "$GITHUB_ENV"
          echo "LANDING=$LANDING" >> "$GITHUB_ENV"
          echo "LOGS=$LOGS" >> "$GITHUB_ENV"
          # Allowlist, listed explicitly (no bypass): sentinel threads A, C, D, plus 99999999999999,
          # the folder the third run adds. Sentinel thread B and the two other-shape folders stay
          # off the list so the run also proves they are skipped.
          cat > "$RUNNER_TEMP/real-ingest.env" <<EOF
          COMPOSE_PROJECT_NAME=gc-wrapped-ci-real
          POSTGRES_HOST_PORT=5544
          DASHBOARD_PORT=8599
          GCW_DB_NAME=gcw_ci
          GCW_LOG_DIR=$LOGS
          GCW_THREAD_ALLOWLIST=1234567890123456,123456789012345,12345678901234,99999999999999
          POSTGRES_USER=gcw
          POSTGRES_PASSWORD=ci-password
          POSTGRES_PORT=5544
          GCW_READER_PASSWORD=ci-reader-password
          GCW_LANDING_HOST_DIR=$LANDING
          EOF
          uv run python tests/synthetic/sentinel.py --out "$LANDING/export_sentinel"
      - name: make real-ingest (first run)
        run: |
          make real-ingest ENV_FILE="$ENV_FILE" 2>&1 | tee "$RUNNER_TEMP/out1.txt"
          test "${PIPESTATUS[0]}" -eq 0
          grep -qx "real-ingest: ok" "$RUNNER_TEMP/out1.txt"
          grep -qx "== step: check-landing ==" "$RUNNER_TEMP/out1.txt"
          grep -qx "== step: e2e ==" "$RUNNER_TEMP/out1.txt"
          grep -qx "target database: gcw_ci" "$RUNNER_TEMP/out1.txt"
          grep -qE "^rows inserted: [1-9][0-9]*$" "$RUNNER_TEMP/out1.txt"
          if grep -qi sentinel "$RUNNER_TEMP/out1.txt"; then echo "sentinel string on terminal output"; exit 1; fi
      - name: make real-ingest (second run inserts nothing)
        run: |
          make real-ingest ENV_FILE="$ENV_FILE" 2>&1 | tee "$RUNNER_TEMP/out2.txt"
          test "${PIPESTATUS[0]}" -eq 0
          grep -qx "real-ingest: ok" "$RUNNER_TEMP/out2.txt"
          grep -qx "rows inserted: 0" "$RUNNER_TEMP/out2.txt"
          test "$(grep '^rows inserted:' "$RUNNER_TEMP/out2.txt" | sort -u)" = "rows inserted: 0"
          if grep -qi sentinel "$RUNNER_TEMP/out2.txt"; then echo "sentinel string on terminal output"; exit 1; fi
      - name: make metrics (aggregate report, fixed labels only)
        run: |
          make metrics ENV_FILE="$ENV_FILE" 2>&1 | tee "$RUNNER_TEMP/out_metrics.txt"
          test "${PIPESTATUS[0]}" -eq 0
          grep -qx "metrics: ok" "$RUNNER_TEMP/out_metrics.txt"
          grep -qx "target database: gcw_ci" "$RUNNER_TEMP/out_metrics.txt"
          grep -qE "^warehouse raw messages: [1-9][0-9]*$" "$RUNNER_TEMP/out_metrics.txt"
          # Deny by default: no ledger was loaded, so no sender is "yes" and nothing is eligible.
          grep -qx "consent senders yes: 0" "$RUNNER_TEMP/out_metrics.txt"
          grep -qx "external-eligible messages: 0" "$RUNNER_TEMP/out_metrics.txt"
          built="$(sed -nE 's/^Done\. PASS=.* TOTAL=([0-9]+)$/\1/p' "$RUNNER_TEMP/out1.txt" | sort -u)"
          counted="$(sed -nE 's/^dbt buildable nodes: ([0-9]+)$/\1/p' "$RUNNER_TEMP/out_metrics.txt")"
          if ! [[ "$built" =~ ^[0-9]+$ && "$built" = "$counted" ]]; then echo "dbt buildable nodes differs from run 1 dbt build total"; exit 1; fi
          if grep -qi sentinel "$RUNNER_TEMP/out_metrics.txt"; then echo "sentinel string on terminal output"; exit 1; fi
      - name: make real-ingest (third run, an allowlisted thread with a malformed message file)
        run: |
          BAD="$LANDING/export_sentinel/your_instagram_activity/messages/inbox/SENTINELNAME_99999999999999"
          mkdir -p "$BAD"
          echo '{"participants": [{"name": "SENTINELNAME x"}], "title": "SENTINELNAME t", "messages": [{"sender_name": "SENTINELNAME bad", "timestamp_ms": "SENTINELTEXT not an int"}]}' > "$BAD/message_1.json"
          set +e
          make real-ingest ENV_FILE="$ENV_FILE" 2>&1 | tee "$RUNNER_TEMP/out3.txt"
          code="${PIPESTATUS[0]}"
          set -e
          test "$code" -ne 0
          grep -q "^real-ingest: failed at " "$RUNNER_TEMP/out3.txt"
          if grep -qx "real-ingest: ok" "$RUNNER_TEMP/out3.txt"; then echo "unexpected real-ingest: ok"; exit 1; fi
          if grep -qi sentinel "$RUNNER_TEMP/out3.txt"; then echo "sentinel string on terminal output"; exit 1; fi
      - name: Private log (synthetic data only) on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-ingest-synthetic-logs
          path: ${{ runner.temp }}/real-ingest-logs
      - name: Stop the stack
        if: always()
        run: docker compose --env-file "$ENV_FILE" down -v
