name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: make lint
      - run: make test

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: gcw
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gcw -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: gcw
      POSTGRES_PASSWORD: ci-password
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://gcw:ci-password@localhost:5432/gcw_dev
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dbt
      - name: Run init SQL (creates gcw_dev, gcw_real, vector extension)
        run: psql "postgresql://gcw:ci-password@localhost:5432/postgres" -v ON_ERROR_STOP=1 -f docker/postgres/init/01-create-databases.sql
      - run: make test-integration
      - run: make dbt-debug
      # End to end on synthetic data: the integration tests leave gcw_dev in an arbitrary state,
      # so reset it, then migrate -> ingest -> dbt build (models + tests).
      - name: Reset gcw_dev
        run: >
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          -c "DROP SCHEMA IF EXISTS raw CASCADE"
          -c "DROP SCHEMA IF EXISTS analytics CASCADE"
          -c "DROP TABLE IF EXISTS schema_migrations"
      - run: uv run gcw migrate
      - run: make synth
      - run: uv run gcw ingest tests/fixtures/synthetic/export_a
      - run: make dbt-deps
      - run: make dbt-build

  airflow:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: gcw
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gcw -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gcw:ci-password@localhost:5432/gcw_dev
      LANDING: ${{ github.workspace }}/ci-landing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Build images (runtime, and runtime + pytest)
        run: |
          docker build -f airflow/Dockerfile --target runtime -t gcw-airflow:runtime .
          docker build -f airflow/Dockerfile --target test -t gcw-airflow:test .
      - name: DAG tests (inside the image)
        run: docker run --rm gcw-airflow:test
      - name: Create gcw_dev and generate a synthetic landing dir
        run: |
          psql "postgresql://gcw:ci-password@localhost:5432/postgres" -v ON_ERROR_STOP=1 -f docker/postgres/init/01-create-databases.sql
          uv run python tests/synthetic/instagram.py --out "$LANDING"
      - name: Run the DAG end to end (airflow dags test)
        run: |
          docker run --rm --network host             -e DATABASE_URL -e GCW_LANDING_DIR=/landing             -e POSTGRES_HOST=localhost -e POSTGRES_PORT=5432             -e POSTGRES_USER=gcw -e POSTGRES_PASSWORD=ci-password             -v "$LANDING:/landing:ro"             gcw-airflow:runtime             bash -c "airflow db migrate && airflow dags test gcw_pipeline" 2>&1 | tee dags-test.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Assert the pipeline produced data and dbt passed
        run: |
          grep -E "PASS=[0-9]+ WARN=[0-9]+ ERROR=0 " dags-test.log
          test "$(psql "$DATABASE_URL" -tA -c 'SELECT count(*) FROM raw.messages')" -gt 0
          test "$(psql "$DATABASE_URL" -tA -c 'SELECT count(*) FROM analytics.fct_messages')" -gt 0
          psql "$DATABASE_URL" -tA -c "SELECT status FROM raw.load_runs ORDER BY load_id DESC LIMIT 1" | grep -qx succeeded
